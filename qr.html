<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR - Para Iris</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0d0020;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      color: #fff;
      padding: 30px;
    }
    h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #ffb3cc, #ff006e, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 8px;
    }
    p { color: #ffb3cc; font-size: 0.95rem; text-align: center; margin-bottom: 24px; }
    #qrcode {
      padding: 16px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(255,0,110,0.5), 0 0 60px rgba(255,0,110,0.2);
      margin-bottom: 20px;
    }
    .url-text {
      font-size: 0.75rem;
      color: rgba(255,179,204,0.6);
      word-break: break-all;
      text-align: center;
      max-width: 300px;
      margin-bottom: 16px;
    }
    .note {
      font-size: 0.85rem;
      color: #ff4d8d;
      text-align: center;
      font-style: italic;
      text-shadow: 0 0 8px #ff006e;
    }
    .hearts { font-size: 1.5rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="hearts">💖 🌷 💖</div>
  <h1>Escánéame, mi amor</h1>
  <div id="qrcode"></div>

  <script>
    // Cambia esta URL por la de GitHub Pages cuando la subas
    // Ejemplo: https://tuusuario.github.io/iris-bday/
    const pageUrl = 'https://paucarcastrowilfredoeder3-lgtm.github.io/cumple-osmivida/';

    new QRCode(document.getElementById('qrcode'), {
      text:         pageUrl,
      width:        220,
      height:       220,
      colorDark:    '#c2185b',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>
</body>
</html>
